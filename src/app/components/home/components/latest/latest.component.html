<section class="latest-section position-relative overflow-hidden">
  <div class="latest-bg-gradient"></div>

  <div class="container position-relative">

    <!-- Header -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end align-items-start mb-5 gap-3">

      <div>
        <span class="section-label d-inline-flex align-items-center mb-3">
          <span class="ping-wrapper me-2">
            <span class="ping"></span>
            <span class="dot"></span>
          </span>
          الأحدث
        </span>

        <h2 class="section-title text-white">أحدث المقالات</h2>
        <p class="section-subtitle">محتوى جديد طازج من المطبعة</p>
      </div>

      <a href="/blog" class="view-all-link d-inline-flex align-items-center gap-2">
        عرض جميع المقالات
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="arrow-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
        </svg>
      </a>

    </div>

    <!-- Cards -->
    <div class="row g-4">

      @for (post of posts(); track post.id; let i = $index){
        <div class="col-md-6 col-lg-4">
        <div class="blog-card h-100">

          <div class="blog-image">
            <img [src]="post.image"
              alt="أساسيات إعدادات الكاميرا">
            <div class="blog-overlay"></div>
            <span class="blog-badge">{{post.category}}</span>
          </div>

          <div class="blog-content">
            <div class="blog-meta">
              <span>{{post.readTime}}</span>
              <span class="meta-dot"></span>
              <span>{{post.date}}</span>
            </div>

            <h5 class="blog-title">
              {{post.title}}
            </h5>

            <p class="blog-desc">
              {{post.excerpt}}
            </p>

            <div class="blog-footer">
              <div class="author">
                <img [src]="post.author.avatar">
                <div>
                  <div class="author-name">{{post.author.name}}</div>
                  <div class="author-role">{{post.author.role}}</div>
                </div>
              </div>

              <div class="read-more-btn">
                →
              </div>
            </div>
          </div>

        </div>
      </div>
      }
     

      <!-- كرر نفس الكارد لباقي المقالات -->
      
    </div>
  </div>
</section>
