<section class="bg-articles ">
    <div class="container-fluid articl-p">
        <div class="row">
            <div class="col ">
                <div class=" mb-5 d-flex align-items-start flex-column gap-4 px-3">
                    <div>
                        <div class="d-inline-flex align-items-center gap-2 articl-label">
                            <span class="spot-2 "></span>
                            <span class="spot"></span>
                            <span class="text-white articl-statue">مميز</span>
                        </div>

                        <h2 class="articl-title">مقالات مختارة</h2>

                        <p class="articl-pa">محتوى منتقى لبدء رحلة تعلمك</p>
                    </div>

                    <div class="me-md-auto">
                        <a class="text-decoration-none more-btn" routerLink="/blog">عرض الكل <i
                                class="fa-solid fa-angle-left me-1"></i></a>
                    </div>
                </div>

                <div class="article-card">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col">
                                @for (post of posts(); track post.id; let i = $index) {

                                <div
                                    class="hovering d-md-flex align-items-md-center justify-content-md-center flex-md-row mb-4">
                                    <div class="article-img">
                                        <img [src]="post.image" alt="">
                                        <span class="img-badge d-flex justify-content-center align-items-center"> <i
                                                class="fa-solid fa-star fa-xs ms-1"></i> مميز </span>
                                    </div>


                                    <div class="article-content flex-column justify-content-md-between ">
                                        <div class="d-flex align-items-center gap-3 mb-3">
                                            <span class="category">{{ post.category }}</span>
                                            <span class="time d-flex justify-content-center align-items-center gap-1"><i
                                                    class="fa-solid fa-clock fa-xs"></i> {{ post.readTime }} </span>
                                        </div>

                                   


                                        <div>
                                            <h2 class="article-title">
                                                {{ post.title }}
                                            </h2>

                                            <p class="article-description mb-4">
                                                {{ post.excerpt }}
                                            </p>
                                        </div>


                                        <div
                                            class="article-footer d-flex justify-content-between align-items-center flex-row-reverse ">
                                            <a [routerLink]="['/blog', post.slug]" class="read-more text-decoration-none"> اقرأ المقال <i
                                                    class="fa-solid fa-arrow-left-long fa-x"></i></a>
                                            <div class="author d-flex align-items-center gap-3">
                                                <div class="author-img">
                                                    <img [src]="post.author.avatar" alt="author">
                                                    <span class="small-circle"></span>
                                                </div>
                                                <div>
                                                    <h4 class="name m-0">{{ post.author.name }}</h4>
                                                    <span class="date">{{ post.date }}</span>
                                                </div>
                                            </div>
                                        </div>


                                          </div>
                                    </div>

                                



                                }
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
